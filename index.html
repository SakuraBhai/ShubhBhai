<script>
(function () {
  'use strict';

  var TELEGRAM_URL = 'https://t.me/+1c3OXTE63vE1MmVl';
  var SECONDS      = 10;                       // exactly 10 seconds
  var CIRC         = 2 * Math.PI * 16;         // progress ring circumference

  var joinBtn  = document.getElementById('joinBtn');
  var countEl  = document.getElementById('count');
  var labelEl  = document.getElementById('countdownLabel');
  var barEl    = document.getElementById('cdBar');
  var avatar   = document.getElementById('avatar');
  var card     = document.getElementById('card');

  var redirected = false;                      // guards against duplicate redirects
  var timerId    = null;
  var shown      = SECONDS;
  var deadline   = 0;
  var leadTracked = false;

  /* ---- In-memory-only interaction signals (nothing is stored or transmitted) ---- */
  var loadedAt = Date.now();
  var lastInput = 0;
  var signals = {
    automationFlag: !!navigator.webdriver ||
                    /HeadlessChrome|PhantomJS|Electron|Puppeteer|Playwright/i.test(navigator.userAgent || '') ||
                    (navigator.languages && navigator.languages.length === 0),
    lastClickTime: 0,
    manualClicks: 0,
    flaggedClicks: 0,
    ignoredClicks: 0,
    rapidClicks: 0
  };

  // Remember when real user input (pointer / touch / keyboard) last happened.
  ['pointerdown', 'touchstart', 'keydown'].forEach(function (type) {
    document.addEventListener(type, function () { lastInput = Date.now(); }, { capture: true, passive: true });
  });

  function stopTimer() {
    if (timerId !== null) { clearInterval(timerId); timerId = null; }
  }

  /* Single redirect entry point: executes at most once. */
  function redirect(source) {
    if (redirected) return;
    redirected = true;
    stopTimer();
    joinBtn.classList.add('is-clicked');
    joinBtn.setAttribute('data-redirect-source', source);   // 'manual', 'manual-flagged' or 'auto'
    window.location.href = TELEGRAM_URL;
  }

  /* ---- Manual click ---- */
  joinBtn.addEventListener('click', function (e) {
    e.preventDefault();

    // Programmatically generated clicks are ignored and never counted as manual.
    if (!e.isTrusted) { signals.ignoredClicks++; return; }

    // Count one Lead for a real manual Join Now click, never for auto-redirect.
    if (!leadTracked && typeof window.fbq === 'function') {
      window.fbq('track', 'Lead');
      leadTracked = true;
    }

    var now = Date.now();
    if (signals.lastClickTime && (now - signals.lastClickTime) < 400) signals.rapidClicks++;
    signals.lastClickTime = now;

    if (redirected) return;                 // duplicate click: already handled

    // Suspicious pattern: automation flag, click before the page could be seen,
    // or a trusted click with no pointer/touch/key input just before it.
    // Visitors are never blocked for this (assistive tech can click without pointer input);
    // the click is only labelled so it is not treated as a clean manual interaction.
    var odd = signals.automationFlag || (now - loadedAt) < 150 || (now - lastInput) > 2000;
    if (odd) signals.flaggedClicks++; else signals.manualClicks++;
    redirect(odd ? 'manual-flagged' : 'manual');   // immediate redirect; cancels the countdown
  });

  /* ---- Back button / bfcache: never auto-redirect a returning visitor a second time ---- */
  window.addEventListener('pageshow', function (e) {
    if (!e.persisted) return;
    stopTimer();
    redirected = false;
    joinBtn.classList.remove('is-clicked');
    joinBtn.removeAttribute('data-redirect-source');
    labelEl.textContent = 'Tap Join Now to open Telegram';
    countEl.textContent = '\u2713';
  });

  /* ---- Countdown: 10 → 9 → … → 1, redirect when 10 s have elapsed ---- */
  function render(n, progress) {
    if (n !== shown) {
      shown = n;
      countEl.textContent = String(n);
      countEl.classList.remove('tick');
      void countEl.offsetWidth;             // restart the small tick animation
      countEl.classList.add('tick');
    }
  }

  function tick() {
    if (redirected) { stopTimer(); return; }
    var left = deadline - Date.now();
    if (left <= 0) {
      render(0, 0);
      labelEl.textContent = 'Opening Telegram...';
      redirect('auto');                     // real navigation, never a simulated click
      return;
    }
    render(Math.ceil(left / 1000), left / (SECONDS * 1000));
  }

  countEl.textContent = String(SECONDS);
  deadline = Date.now() + SECONDS * 1000;
  timerId  = setInterval(tick, 200);        // 10 s total, display changes once per second

  var reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

  /* ---- Pointer spotlight (desktop only, throttled to one update per frame) ---- */
  if (window.matchMedia && window.matchMedia('(hover: hover) and (pointer: fine)').matches && !reduceMotion) {
    var px = 0, py = 0, queued = false;
    document.addEventListener('pointermove', function (e) {
      px = e.clientX; py = e.clientY;
      if (queued) return;
      queued = true;
      requestAnimationFrame(function () {
        queued = false;
        var r = card.getBoundingClientRect();
        card.style.setProperty('--mx', (px - r.left) + 'px');
        card.style.setProperty('--my', (py - r.top) + 'px');
      });
    }, { passive: true });
  }

  /* ---- Ambient dust: pre-rendered glow sprites, no per-frame blur ---- */
  (function dust() {
    var cv = document.getElementById('dust');
    if (!cv || !cv.getContext || reduceMotion) return;
    var ctx = cv.getContext('2d');
    var dpr = Math.min(window.devicePixelRatio || 1, 1.5);
    var W = 0, H = 0, parts = [], sprites = [], last = 0, raf = 0;
    var colors = ['245,199,107', '42,171,238', '139,92,246', '255,255,255'];

    colors.forEach(function (c) {
      var s = document.createElement('canvas');
      s.width = s.height = 32;
      var g = s.getContext('2d');
      var gr = g.createRadialGradient(16, 16, 0, 16, 16, 16);
      gr.addColorStop(0, 'rgba(' + c + ',1)');
      gr.addColorStop(.25, 'rgba(' + c + ',.55)');
      gr.addColorStop(1, 'rgba(' + c + ',0)');
      g.fillStyle = gr; g.fillRect(0, 0, 32, 32);
      sprites.push(s);
    });

    function make(initial) {
      return {
        x: Math.random() * W,
        y: initial ? Math.random() * H : H + 12,
        d: Math.random() * 8 + 5,
        vy: Math.random() * 14 + 6,
        vx: (Math.random() - .5) * 6,
        a: Math.random() * .55 + .25,
        p: Math.random() * 6.28,
        s: (Math.random() * sprites.length) | 0
      };
    }
    function resize() {
      W = window.innerWidth; H = window.innerHeight;
      cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
      ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
      var n = W < 600 ? 16 : 30;
      parts = [];
      for (var i = 0; i < n; i++) parts.push(make(true));
    }
    function frame(now) {
      var dt = Math.min((now - (last || now)) / 1000, .05);
      last = now;
      if (!document.hidden) {
        ctx.clearRect(0, 0, W, H);
        for (var i = 0; i < parts.length; i++) {
          var p = parts[i];
          p.p += dt * 1.4;
          p.y -= p.vy * dt;
          p.x += (p.vx + Math.sin(p.p) * 4) * dt;
          if (p.y < -12) { parts[i] = make(false); continue; }
          ctx.globalAlpha = p.a * (.6 + Math.sin(p.p * 2) * .4);
          ctx.drawImage(sprites[p.s], p.x - p.d / 2, p.y - p.d / 2, p.d, p.d);
        }
        ctx.globalAlpha = 1;
      }
      raf = requestAnimationFrame(frame);
    }
    var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(resize, 150); });
    resize();
    raf = requestAnimationFrame(frame);
    document.addEventListener('visibilitychange', function () {
      if (document.hidden) { cancelAnimationFrame(raf); raf = 0; }
      else if (!raf) { last = 0; raf = requestAnimationFrame(frame); }
    });
  })();

  /* ---- Image fallback: clean round placeholder if the picture fails to load ---- */
  avatar.addEventListener('error', function onErr() {
    avatar.removeEventListener('error', onErr);
    var svg =
      '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200">' +
      '<defs><linearGradient id="g" x1="0" y1="0" x2="1" y2="1">' +
      '<stop offset="0" stop-color="#3b1c7a"/><stop offset="1" stop-color="#0b1030"/></linearGradient></defs>' +
      '<rect width="200" height="200" fill="url(#g)"/>' +
      '<text x="100" y="124" font-family="Arial,sans-serif" font-size="78" font-weight="900" ' +
      'text-anchor="middle" fill="#fff">TS</text></svg>';
    avatar.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(svg);
  });
})();
